name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Set up .NET for pinned Velopack CLI
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test Windows libmpv bundle verifier
        shell: pwsh
        run: .\tools\windows\test-verify-libmpv-bundle.ps1

      - name: Test libmpv dependency installer
        shell: pwsh
        run: .\tools\windows\test-install-libmpv-dependency.ps1

      - name: Test latest libmpv resolver
        shell: pwsh
        run: .\tools\windows\test-resolve-latest-libmpv-dependency.ps1

      - name: Test Android release preparation
        shell: pwsh
        run: .\tools\windows\test-prepare-android-release.ps1

      - name: Resolve latest LGPL libmpv release
        id: libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $resolutionPath = Join-Path $env:RUNNER_TEMP "libmpv-resolution.json"
          .\tools\windows\resolve-latest-libmpv-dependency.ps1 `
            -OutputPath $resolutionPath
          $manifest = Get-Content -LiteralPath $resolutionPath -Raw | ConvertFrom-Json
          $cacheDir = Join-Path $env:RUNNER_TEMP "libmpv-archive-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $archivePath = Join-Path $cacheDir $manifest.archiveFileName
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive-sha256=$($manifest.archiveSha256.ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive-url=$($manifest.archiveUrl)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive-path=$archivePath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cache-dir=$cacheDir"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "resolution-path=$resolutionPath"

      - name: Cache resolved libmpv archive by digest
        uses: actions/cache@v6
        with:
          path: ${{ steps.libmpv.outputs.cache-dir }}
          key: libmpv-windows-${{ steps.libmpv.outputs.archive-sha256 }}

      - name: Download and install resolved libmpv dependency
        shell: pwsh
        run: |
          $archivePath = "${{ steps.libmpv.outputs.archive-path }}"
          $expectedHash = "${{ steps.libmpv.outputs.archive-sha256 }}"
          if ((Test-Path -LiteralPath $archivePath -PathType Leaf) -and
              (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $expectedHash) {
            Remove-Item -LiteralPath $archivePath -Force
          }
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            $archiveUrl = "${{ steps.libmpv.outputs.archive-url }}"
            Write-Host "Downloading latest resolved libmpv archive from $archiveUrl"
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath -UseBasicParsing
          } else {
            Write-Host "Using digest-keyed libmpv archive cache at $archivePath"
          }
          .\tools\windows\install-libmpv-dependency.ps1 `
            -ManifestPath "${{ steps.libmpv.outputs.resolution-path }}" `
            -ArchivePath $archivePath `
            -ProvenancePath .\runtime\windows\libmpv\libmpv-provenance.json `
            -AcceptLicense

      - name: Decode Android CI signing key
        shell: pwsh
        env:
          DANMAKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.DANMAKU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DANMAKU_ANDROID_KEYSTORE_BASE64)) {
            Write-Host "Android CI signing key is not configured; using the runner debug key."
            exit 0
          }
          [System.IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\danmaku-android-ci.keystore",
            [Convert]::FromBase64String($env:DANMAKU_ANDROID_KEYSTORE_BASE64)
          )

      - name: Build and test shared/Android targets
        shell: pwsh
        env:
          DANMAKU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\danmaku-android-ci.keystore
          DANMAKU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DANMAKU_ANDROID_KEYSTORE_PASSWORD }}
          DANMAKU_ANDROID_KEY_ALIAS: ${{ secrets.DANMAKU_ANDROID_KEY_ALIAS }}
          DANMAKU_ANDROID_KEY_PASSWORD: ${{ secrets.DANMAKU_ANDROID_KEY_PASSWORD }}
        run: .\gradlew.bat --no-daemon :shared:domain:jvmTest :shared:library-client:jvmTest :shared:library-client-android:testDebugUnitTest :shared:app-update-android:testDebugUnitTest :shared:player-android-media3:assembleDebugAndroidTest :apps:android-mobile:assembleDebug :apps:android-tv:assembleDebug

      - name: Build packaged web UI
        working-directory: apps/web-ui
        run: |
          npm ci
          npm run build

      - name: Package Rust native player
        shell: pwsh
        run: .\tools\windows\prepare-rust-player-release.ps1

      - name: Install pinned Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path "$env:RUNNER_TEMP\vpk" vpk --version 1.2.0

      - name: Verify unsigned Windows installer packaging
        shell: pwsh
        run: |
          .\tools\windows\prepare-windows-installer.ps1 `
            -VpkPath "$env:RUNNER_TEMP\vpk\vpk.exe"

      - name: Upload Android Mobile APK
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-android-mobile-debug
          path: apps/android-mobile/build/outputs/apk/debug/android-mobile-debug.apk
          if-no-files-found: error

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-android-tv-debug
          path: apps/android-tv/build/outputs/apk/debug/android-tv-debug.apk
          if-no-files-found: error

      - name: Upload Windows Native Player
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-windows-native-player
          path: build/release/rust-player/*.zip
          if-no-files-found: error

      - name: Upload unsigned Windows installer verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-windows-installer-unsigned
          path: |
            build/release/windows-installer/*-Setup.exe
            build/release/windows-installer/*-full.nupkg
            build/release/windows-installer/releases.win-x64-stable.json
          if-no-files-found: error

  rust:
    name: Rust format and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Package Rust library server
        shell: pwsh
        run: .\tools\windows\prepare-rust-server-release.ps1

      - name: Upload Rust Library Server
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-rust-library-server
          path: build/release/rust-library-server/*.zip
          if-no-files-found: error

  macos-native:
    name: macOS native build and package
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Install macOS libmpv
        run: brew install mpv

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace on macOS
        run: cargo test --workspace

      - name: Build packaged web UI
        working-directory: apps/web-ui
        run: |
          npm ci
          npm run build

      - name: Package and verify macOS app
        run: ./tools/macos/prepare-rust-player-release.sh

      - name: Upload macOS Native Player
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-macos-native-player
          path: build/release/macos/*.zip
          if-no-files-found: error

  dandanplay-worker-proxy:
    name: Dandanplay Worker proxy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/dandanplay-worker-proxy/package-lock.json

      - name: Install Worker dependencies
        working-directory: tools/dandanplay-worker-proxy
        run: npm ci

      - name: Typecheck Worker proxy
        working-directory: tools/dandanplay-worker-proxy
        run: npm run typecheck

      - name: Test Worker proxy
        working-directory: tools/dandanplay-worker-proxy
        run: npm test
